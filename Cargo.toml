[package]
name = "mc-loot-finder"
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
glam = "0.33"
rustc-hash = "2"
steel-registry = { git = "https://github.com/Steel-Foundation/SteelMC.git", branch = "master" }
steel-utils = { git = "https://github.com/Steel-Foundation/SteelMC.git", branch = "master" }
steel-worldgen = { git = "https://github.com/Steel-Foundation/SteelMC.git", branch = "master" }
thiserror = "2"

[[bin]]
name = "mc-loot-finder"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = true
strip = true
