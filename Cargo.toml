[package]
name = "mc-loot-finder"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
pumpkin-world = { git = "https://github.com/Br0bserver/Pumpkin.git", rev = "c27dba8ff0af489feec17fdbef542508e7a8e59a" }
pumpkin-data = { git = "https://github.com/Br0bserver/Pumpkin.git", rev = "c27dba8ff0af489feec17fdbef542508e7a8e59a" }
