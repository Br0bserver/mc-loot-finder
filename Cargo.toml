[package]
name = "mc-loot-finder"
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
clap = { version = "4", features = ["derive"] }
pumpkin-world = { git = "https://github.com/Br0bserver/Pumpkin.git", rev = "24702a182c9c84f09cf5f52a1620ee18efd8dec6" }
pumpkin-data = { git = "https://github.com/Br0bserver/Pumpkin.git", rev = "24702a182c9c84f09cf5f52a1620ee18efd8dec6" }
pumpkin-util = { git = "https://github.com/Br0bserver/Pumpkin.git", rev = "24702a182c9c84f09cf5f52a1620ee18efd8dec6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"

[[bin]]
name = "mc-loot-finder"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = true
strip = true
