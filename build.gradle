plugins {
    id "java"
    id "application"
    id "net.fabricmc.fabric-loom" version "${loom_version}"
}

group = "dev.br0b"
version = "0.2.2"

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "org.objenesis:objenesis:3.4"

    testImplementation platform("org.junit:junit-bom:5.12.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "org.mockito:mockito-core:5.20.0"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

application {
    mainClass = "dev.br0b.mclootfinder.cli.Main"
    applicationDefaultJvmArgs = ["--sun-misc-unsafe-memory-access=allow"]
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

distributions {
    main {
        contents {
            from("LICENSE")
            from("README.md")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = "UTF-8"
}

tasks.named("test", Test) {
    useJUnitPlatform()
    maxHeapSize = "2G"
    jvmArgs "--sun-misc-unsafe-memory-access=allow"
}

tasks.named("jar", Jar) {
    manifest {
        attributes(
                "Main-Class": application.mainClass.get(),
                "Class-Path": configurations.runtimeClasspath.files
                        .collect { it.name }
                        .join(" ")
        )
    }
}

tasks.named("startScripts") {
    doLast {
        String original = windowsScript.getText("UTF-8")
        String applicationJar = tasks.named("jar", Jar).get().archiveFileName.get()
        String shortened = original
                .replaceFirst(/(?m)^set CLASSPATH=.*\r?\n/, "")
                .replace(
                        '  -classpath "%CLASSPATH%" dev.br0b.mclootfinder.cli.Main',
                        " -jar \"%APP_HOME%\\lib\\${applicationJar}\""
                )
        if (shortened == original) {
            throw new GradleException("Windows launcher command was not updated")
        }
        if (shortened.contains("set CLASSPATH=") || shortened.contains("-classpath")) {
            throw new GradleException("Windows launcher still contains an expanded classpath")
        }
        windowsScript.setText(shortened, "UTF-8")
    }
}

tasks.register("runCli", JavaExec) {
    group = "application"
    description = "Runs the standalone loot-finder CLI"
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    jvmArgs "--sun-misc-unsafe-memory-access=allow"
    standardInput = System.in
}
