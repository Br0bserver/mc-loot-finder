plugins {
    id "java"
    id "application"
    id "net.fabricmc.fabric-loom" version "${loom_version}"
}

group = "dev.br0b"
version = "0.1.0-SNAPSHOT"

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "org.objenesis:objenesis:3.4"

    testImplementation platform("org.junit:junit-bom:5.12.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "org.mockito:mockito-core:5.20.0"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

application {
    mainClass = "dev.br0b.mclootfinder.cli.Main"
    applicationDefaultJvmArgs = ["--sun-misc-unsafe-memory-access=allow"]
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = "UTF-8"
}

tasks.named("test", Test) {
    useJUnitPlatform()
    maxHeapSize = "2G"
    jvmArgs "--sun-misc-unsafe-memory-access=allow"
}

tasks.named("startScripts") {
    doLast {
        String original = windowsScript.getText("UTF-8")
        String shortened = original
                .replace('endlocal & "%JAVA_EXE%"', '"%JAVA_EXE%"')
                .replace('  -classpath "%CLASSPATH%"', '')
        if (shortened == original) {
            throw new GradleException("Windows launcher command was not updated")
        }
        if (shortened.contains('endlocal & "%JAVA_EXE%"')
                || shortened.contains('-classpath "%CLASSPATH%"')) {
            throw new GradleException("Windows launcher still expands CLASSPATH on the command line")
        }
        windowsScript.setText(shortened, "UTF-8")
    }
}

tasks.register("runCli", JavaExec) {
    group = "application"
    description = "Runs the standalone loot-finder CLI"
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    jvmArgs "--sun-misc-unsafe-memory-access=allow"
    standardInput = System.in
}
