name: Java CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - build.gradle
      - gradle.properties
      - settings.gradle
      - gradle/**
      - gradlew
      - gradlew.bat
      - src/**
      - .github/scripts/verify_distribution.py
      - .github/workflows/java.yml
  pull_request:
    paths:
      - build.gradle
      - gradle.properties
      - settings.gradle
      - gradle/**
      - gradlew
      - gradlew.bat
      - src/**
      - .github/scripts/verify_distribution.py
      - .github/workflows/java.yml

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and build distributions
        run: ./gradlew test installDist distZip distTar --no-daemon
      - name: Verify installed CLI
        run: >-
          python3 .github/scripts/verify_distribution.py
          build/install/mc-loot-finder/bin/mc-loot-finder
      - uses: actions/upload-artifact@v7
        with:
          name: mc-loot-finder-java-26.1.2
          path: build/distributions/*
          if-no-files-found: error

  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build installed CLI
        run: .\gradlew.bat installDist --no-daemon
      - name: Verify installed CLI
        run: >-
          py -3 .github/scripts/verify_distribution.py
          build/install/mc-loot-finder/bin/mc-loot-finder.bat
