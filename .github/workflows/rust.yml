name: Rust CI

on:
  workflow_dispatch:
  push:
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - .github/workflows/rust.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - .github/workflows/rust.yml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Check formatting
        run: cargo fmt --check
      - name: Check Rust CLI
        run: cargo check --locked
      - name: Diagnose ancient city biome mismatch
        run: cargo test --release --locked diagnose_26_1_2_biome_mismatch -- --nocapture
      - name: Diagnose ancient city layout mismatch
        run: cargo test --release --locked diagnose_26_1_2_layout_mismatch -- --nocapture
      - name: Build and run ancient city smoke test
        run: |
          cargo run --release --locked -- chests \
            --seed 114514 \
            --structure ancient_city \
            --radius 5000 \
            --limit 1000 \
            --json | tee ancient-city-chests.json
      - uses: actions/upload-artifact@v4
        with:
          name: ancient-city-chests
          path: ancient-city-chests.json
