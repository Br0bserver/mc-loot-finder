name: Rust CI

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

on:
  workflow_dispatch:
    inputs:
      command:
        description: "CLI command to run (chests/find/candidates)"
        required: false
        default: "chests"
      structure:
        description: "Structure name"
        required: false
        default: "ancient_city"
      seed:
        description: "World seed"
        required: false
        default: "114514"
      args:
        description: "Extra CLI arguments (e.g. --radius 5000 --json)"
        required: false
        default: "--radius 5000 --json"
  push:
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - .github/workflows/rust.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - .github/workflows/rust.yml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint with clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Check Rust CLI
        run: cargo check --locked
      - name: Test Rust CLI
        run: cargo test --release --locked
      - name: Install static Linux linker
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Build static release binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Run requested CLI command (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          target/x86_64-unknown-linux-musl/release/mc-loot-finder ${{ inputs.command }} \
            --seed ${{ inputs.seed }} \
            --structure ${{ inputs.structure }} \
            ${{ inputs.args }}
      - name: Run ancient city smoke test
        run: |
          target/x86_64-unknown-linux-musl/release/mc-loot-finder chests \
            --seed 114514 \
            --structure ancient_city \
            --radius 5000 \
            --limit 1000 \
            --json | tee ancient-city-chests.json
      - name: Run bastion remnant smoke test
        run: |
          result=$(target/x86_64-unknown-linux-musl/release/mc-loot-finder find \
            --seed 0 \
            --structure bastion_remnant \
            --item minecraft:netherite_upgrade_smithing_template \
            --center-x 1000 \
            --center-z 520 \
            --radius 0 \
            --json)
          python3 - "$result" <<'PY'
          import json
          import sys

          result = json.loads(sys.argv[1])
          expected = {
              "placement_candidates": 1,
              "valid_structures": 1,
              "checked_chests": 6,
              "hits": 1,
          }
          actual = {key: result[key] for key in expected}
          if actual != expected:
              raise SystemExit(f"unexpected bastion result: {result}")
          PY
      - name: Check find exit codes
        run: |
          target/x86_64-unknown-linux-musl/release/mc-loot-finder find \
            --seed 114514 \
            --structure ancient_city \
            --item minecraft:silence_armor_trim_smithing_template \
            --radius 5000 \
            --json

          if target/x86_64-unknown-linux-musl/release/mc-loot-finder find \
            --seed 114514 \
            --structure ancient_city \
            --item minecraft:bedrock \
            --radius 0 \
            --json
          then
            echo "expected a no-match search to exit with status 1" >&2
            exit 1
          else
            status=$?
            test "$status" -eq 1
          fi
      - name: Run desert pyramid smoke test
        run: |
          result=$(target/x86_64-unknown-linux-musl/release/mc-loot-finder chests \
            --seed 0 \
            --structure desert_pyramid \
            --radius 5000 \
            --limit 1000 \
            --json)
          python3 - "$result" <<'PY'
          import json
          import sys

          result = json.loads(sys.argv[1])
          expected = {
              "placement_candidates": 307,
              "valid_structures": 3,
              "chest_count": 12,
          }
          actual = {key: result[key] for key in expected}
          if actual != expected:
              raise SystemExit(f"unexpected desert pyramid chests result: {result}")
          PY
      - name: Run desert pyramid find smoke test
        run: |
          result=$(target/x86_64-unknown-linux-musl/release/mc-loot-finder find \
            --seed 0 \
            --structure desert_pyramid \
            --item minecraft:dune_armor_trim_smithing_template \
            --radius 5000 \
            --limit 20 \
            --json)
          python3 - "$result" <<'PY'
          import json
          import sys

          result = json.loads(sys.argv[1])
          expected = {
              "placement_candidates": 307,
              "valid_structures": 3,
              "checked_chests": 12,
              "hits": 5,
          }
          actual = {key: result[key] for key in expected}
          if actual != expected:
              raise SystemExit(f"unexpected desert pyramid find result: {result}")
          PY
      - name: Run igloo smoke test
        run: |
          result=$(target/x86_64-unknown-linux-musl/release/mc-loot-finder chests \
            --seed 0 \
            --structure igloo \
            --radius 5000 \
            --limit 1000 \
            --json)
          python3 - "$result" <<'PY'
          import json
          import sys

          result = json.loads(sys.argv[1])
          expected = {
              "placement_candidates": 299,
              "valid_structures": 26,
              "chest_count": 14,
          }
          actual = {key: result[key] for key in expected}
          if actual != expected:
              raise SystemExit(f"unexpected igloo chests result: {result}")
          PY
          result=$(target/x86_64-unknown-linux-musl/release/mc-loot-finder find \
            --seed 0 \
            --structure igloo \
            --item minecraft:golden_apple \
            --radius 5000 \
            --limit 20 \
            --json)
          python3 - "$result" <<'PY'
          import json
          import sys

          result = json.loads(sys.argv[1])
          expected = {
              "placement_candidates": 299,
              "valid_structures": 26,
              "checked_chests": 14,
              "hits": 14,
          }
          actual = {key: result[key] for key in expected}
          if actual != expected:
              raise SystemExit(f"unexpected igloo find result: {result}")
          PY
      - name: Run village smoke test
        run: |
          result=$(target/x86_64-unknown-linux-musl/release/mc-loot-finder chests \
            --seed 0 \
            --structure village \
            --radius 5000 \
            --limit 1000 \
            --json)
          python3 - "$result" <<'PY'
          import json
          import sys

          result = json.loads(sys.argv[1])
          expected = {
              "placement_candidates": 267,
              "valid_structures": 60,
              "chest_count": 155,
          }
          actual = {key: result[key] for key in expected}
          if actual != expected:
              raise SystemExit(f"unexpected village chests result: {result}")
          PY
          result=$(target/x86_64-unknown-linux-musl/release/mc-loot-finder find \
            --seed 0 \
            --structure village \
            --item minecraft:diamond \
            --radius 5000 \
            --limit 20 \
            --json)
          python3 - "$result" <<'PY'
          import json
          import sys

          result = json.loads(sys.argv[1])
          expected = {
              "placement_candidates": 267,
              "valid_structures": 60,
              "checked_chests": 155,
              "hits": 3,
          }
          actual = {key: result[key] for key in expected}
          if actual != expected:
              raise SystemExit(f"unexpected village find result: {result}")
          PY
      - name: Run pillager outpost smoke test
        run: |
          result=$(target/x86_64-unknown-linux-musl/release/mc-loot-finder chests \
            --seed 0 \
            --structure pillager_outpost \
            --radius 5000 \
            --limit 1000 \
            --json)
          python3 - "$result" <<'PY'
          import json
          import sys

          result = json.loads(sys.argv[1])
          expected = {
              "placement_candidates": 298,
              "valid_structures": 10,
              "chest_count": 10,
          }
          actual = {key: result[key] for key in expected}
          if actual != expected:
              raise SystemExit(f"unexpected pillager chests result: {result}")
          PY
          result=$(target/x86_64-unknown-linux-musl/release/mc-loot-finder find \
            --seed 0 \
            --structure pillager_outpost \
            --item minecraft:sentry_armor_trim_smithing_template \
            --radius 5000 \
            --limit 20 \
            --json)
          python3 - "$result" <<'PY'
          import json
          import sys

          result = json.loads(sys.argv[1])
          expected = {
              "placement_candidates": 298,
              "valid_structures": 10,
              "checked_chests": 10,
              "hits": 1,
          }
          actual = {key: result[key] for key in expected}
          if actual != expected:
              raise SystemExit(f"unexpected pillager find result: {result}")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: ancient-city-chests
          path: ancient-city-chests.json
      - uses: actions/upload-artifact@v7
        with:
          name: mc-loot-finder-linux-x86_64
          path: target/x86_64-unknown-linux-musl/release/mc-loot-finder

  windows-x86_64:
    runs-on: windows-latest
    env:
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build release binary
        run: cargo build --release --locked
      - name: Run ancient city smoke test
        shell: pwsh
        run: |
          $json = & target\release\mc-loot-finder.exe find `
            --seed 114514 `
            --structure ancient_city `
            --item minecraft:silence_armor_trim_smithing_template `
            --radius 5000 `
            --json
          if ($LASTEXITCODE -ne 0) {
            throw "find exited with status $LASTEXITCODE"
          }
          $result = $json | ConvertFrom-Json
          if ($result.placement_candidates -ne 530 -or
              $result.valid_structures -ne 17 -or
              $result.checked_chests -ne 358 -or
              $result.hits -ne 1) {
            throw "unexpected ancient city result: $json"
          }
      - name: Run bastion remnant smoke test
        shell: pwsh
        run: |
          $json = & target\release\mc-loot-finder.exe find `
            --seed 0 `
            --structure bastion_remnant `
            --item minecraft:netherite_upgrade_smithing_template `
            --center-x 1000 `
            --center-z 520 `
            --radius 0 `
            --json
          if ($LASTEXITCODE -ne 0) {
            throw "find exited with status $LASTEXITCODE"
          }
          $result = $json | ConvertFrom-Json
          if ($result.placement_candidates -ne 1 -or
              $result.valid_structures -ne 1 -or
              $result.checked_chests -ne 6 -or
              $result.hits -ne 1) {
            throw "unexpected bastion result: $json"
          }
      - name: Run desert pyramid smoke test
        shell: pwsh
        run: |
          $json = & target\release\mc-loot-finder.exe chests `
            --seed 0 `
            --structure desert_pyramid `
            --radius 5000 `
            --limit 1000 `
            --json
          if ($LASTEXITCODE -ne 0) {
            throw "chests exited with status $LASTEXITCODE"
          }
          $result = $json | ConvertFrom-Json
          if ($result.placement_candidates -ne 307 -or
              $result.valid_structures -ne 3 -or
              $result.chest_count -ne 12) {
            throw "unexpected desert pyramid chests result: $json"
          }
          $json = & target\release\mc-loot-finder.exe find `
            --seed 0 `
            --structure desert_pyramid `
            --item minecraft:dune_armor_trim_smithing_template `
            --radius 5000 `
            --limit 20 `
            --json
          if ($LASTEXITCODE -ne 0) {
            throw "find exited with status $LASTEXITCODE"
          }
          $result = $json | ConvertFrom-Json
          if ($result.placement_candidates -ne 307 -or
              $result.valid_structures -ne 3 -or
              $result.checked_chests -ne 12 -or
              $result.hits -ne 5) {
            throw "unexpected desert pyramid find result: $json"
          }
      - name: Run igloo smoke test
        shell: pwsh
        run: |
          $json = & target\release\mc-loot-finder.exe chests `
            --seed 0 `
            --structure igloo `
            --radius 5000 `
            --limit 1000 `
            --json
          if ($LASTEXITCODE -ne 0) {
            throw "chests exited with status $LASTEXITCODE"
          }
          $result = $json | ConvertFrom-Json
          if ($result.placement_candidates -ne 299 -or
              $result.valid_structures -ne 26 -or
              $result.chest_count -ne 14) {
            throw "unexpected igloo chests result: $json"
          }
          $json = & target\release\mc-loot-finder.exe find `
            --seed 0 `
            --structure igloo `
            --item minecraft:golden_apple `
            --radius 5000 `
            --limit 20 `
            --json
          if ($LASTEXITCODE -ne 0) {
            throw "find exited with status $LASTEXITCODE"
          }
          $result = $json | ConvertFrom-Json
          if ($result.placement_candidates -ne 299 -or
              $result.valid_structures -ne 26 -or
              $result.checked_chests -ne 14 -or
              $result.hits -ne 14) {
            throw "unexpected igloo find result: $json"
          }
      - name: Run village smoke test
        shell: pwsh
        run: |
          $json = & target\release\mc-loot-finder.exe chests `
            --seed 0 `
            --structure village `
            --radius 5000 `
            --limit 1000 `
            --json
          if ($LASTEXITCODE -ne 0) {
            throw "chests exited with status $LASTEXITCODE"
          }
          $result = $json | ConvertFrom-Json
          if ($result.placement_candidates -ne 267 -or
              $result.valid_structures -ne 60 -or
              $result.chest_count -ne 155) {
            throw "unexpected village chests result: $json"
          }
          $json = & target\release\mc-loot-finder.exe find `
            --seed 0 `
            --structure village `
            --item minecraft:diamond `
            --radius 5000 `
            --limit 20 `
            --json
          if ($LASTEXITCODE -ne 0) {
            throw "find exited with status $LASTEXITCODE"
          }
          $result = $json | ConvertFrom-Json
          if ($result.placement_candidates -ne 267 -or
              $result.valid_structures -ne 60 -or
              $result.checked_chests -ne 155 -or
              $result.hits -ne 3) {
            throw "unexpected village find result: $json"
          }
      - name: Run pillager outpost smoke test
        shell: pwsh
        run: |
          $json = & target\release\mc-loot-finder.exe chests `
            --seed 0 `
            --structure pillager_outpost `
            --radius 5000 `
            --limit 1000 `
            --json
          if ($LASTEXITCODE -ne 0) {
            throw "chests exited with status $LASTEXITCODE"
          }
          $result = $json | ConvertFrom-Json
          if ($result.placement_candidates -ne 298 -or
              $result.valid_structures -ne 10 -or
              $result.chest_count -ne 10) {
            throw "unexpected pillager chests result: $json"
          }
          $json = & target\release\mc-loot-finder.exe find `
            --seed 0 `
            --structure pillager_outpost `
            --item minecraft:sentry_armor_trim_smithing_template `
            --radius 5000 `
            --limit 20 `
            --json
          if ($LASTEXITCODE -ne 0) {
            throw "find exited with status $LASTEXITCODE"
          }
          $result = $json | ConvertFrom-Json
          if ($result.placement_candidates -ne 298 -or
              $result.valid_structures -ne 10 -or
              $result.checked_chests -ne 10 -or
              $result.hits -ne 1) {
            throw "unexpected pillager find result: $json"
          }
      - name: Prepare Windows binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target\release\mc-loot-finder.exe dist\mc-loot-finder-windows-x86_64.exe
      - uses: actions/upload-artifact@v7
        with:
          name: mc-loot-finder-windows-x86_64
          path: dist/mc-loot-finder-windows-x86_64.exe
