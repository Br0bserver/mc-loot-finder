name: Rust CI

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

on:
  workflow_dispatch:
  push:
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - .github/workflows/rust.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - .github/workflows/rust.yml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint with clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Check Rust CLI
        run: cargo check --locked
      - name: Test Rust CLI
        run: cargo test --release --locked
      - name: Install static Linux linker
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Build static release binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Run ancient city smoke test
        run: |
          target/x86_64-unknown-linux-musl/release/mc-loot-finder chests \
            --seed 114514 \
            --structure ancient_city \
            --radius 5000 \
            --limit 1000 \
            --json | tee ancient-city-chests.json
      - name: Run bastion remnant smoke test
        run: |
          result=$(target/x86_64-unknown-linux-musl/release/mc-loot-finder find \
            --seed 0 \
            --structure bastion_remnant \
            --item minecraft:netherite_upgrade_smithing_template \
            --center-x 1000 \
            --center-z 520 \
            --radius 0 \
            --json)
          python3 - "$result" <<'PY'
          import json
          import sys

          result = json.loads(sys.argv[1])
          expected = {
              "placement_candidates": 1,
              "valid_structures": 1,
              "checked_chests": 6,
              "hits": 1,
          }
          actual = {key: result[key] for key in expected}
          if actual != expected:
              raise SystemExit(f"unexpected bastion result: {result}")
          PY
      - name: Check find exit codes
        run: |
          target/x86_64-unknown-linux-musl/release/mc-loot-finder find \
            --seed 114514 \
            --structure ancient_city \
            --item minecraft:silence_armor_trim_smithing_template \
            --radius 5000 \
            --json

          if target/x86_64-unknown-linux-musl/release/mc-loot-finder find \
            --seed 114514 \
            --structure ancient_city \
            --item minecraft:bedrock \
            --radius 0 \
            --json
          then
            echo "expected a no-match search to exit with status 1" >&2
            exit 1
          else
            status=$?
            test "$status" -eq 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ancient-city-chests
          path: ancient-city-chests.json
      - uses: actions/upload-artifact@v7
        with:
          name: mc-loot-finder-linux-x86_64
          path: target/x86_64-unknown-linux-musl/release/mc-loot-finder

  windows-x86_64:
    runs-on: windows-latest
    env:
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build release binary
        run: cargo build --release --locked
      - name: Run ancient city smoke test
        shell: pwsh
        run: |
          $json = & target\release\mc-loot-finder.exe find `
            --seed 114514 `
            --structure ancient_city `
            --item minecraft:silence_armor_trim_smithing_template `
            --radius 5000 `
            --json
          if ($LASTEXITCODE -ne 0) {
            throw "find exited with status $LASTEXITCODE"
          }
          $result = $json | ConvertFrom-Json
          if ($result.placement_candidates -ne 530 -or
              $result.valid_structures -ne 17 -or
              $result.checked_chests -ne 358 -or
              $result.hits -ne 1) {
            throw "unexpected ancient city result: $json"
          }
      - name: Run bastion remnant smoke test
        shell: pwsh
        run: |
          $json = & target\release\mc-loot-finder.exe find `
            --seed 0 `
            --structure bastion_remnant `
            --item minecraft:netherite_upgrade_smithing_template `
            --center-x 1000 `
            --center-z 520 `
            --radius 0 `
            --json
          if ($LASTEXITCODE -ne 0) {
            throw "find exited with status $LASTEXITCODE"
          }
          $result = $json | ConvertFrom-Json
          if ($result.placement_candidates -ne 1 -or
              $result.valid_structures -ne 1 -or
              $result.checked_chests -ne 6 -or
              $result.hits -ne 1) {
            throw "unexpected bastion result: $json"
          }
      - name: Prepare Windows binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target\release\mc-loot-finder.exe dist\mc-loot-finder-windows-x86_64.exe
      - uses: actions/upload-artifact@v7
        with:
          name: mc-loot-finder-windows-x86_64
          path: dist/mc-loot-finder-windows-x86_64.exe
