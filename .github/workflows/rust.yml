name: Rust CI

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

on:
  workflow_dispatch:
    inputs:
      command:
        description: "CLI command to run (chests/find/candidates)"
        required: false
        default: "chests"
      structure:
        description: "Structure name"
        required: false
        default: "ancient_city"
      seed:
        description: "World seed"
        required: false
        default: "114514"
      args:
        description: "Extra CLI arguments (e.g. --radius 5000 --json)"
        required: false
        default: "--radius 5000 --json"
  push:
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - ci/**
      - .github/workflows/rust.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - ci/**
      - .github/workflows/rust.yml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint with clippy
        run: >-
          cargo clippy --all-targets --
          -D warnings
          -D clippy::dbg_macro
          -D clippy::todo
          -D clippy::unimplemented
      - name: Check Rust CLI
        run: cargo check --locked
      - name: Test Rust CLI
        run: cargo test --release --locked
      - name: Install static Linux linker
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Build static release binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Run requested CLI command (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          target/x86_64-unknown-linux-musl/release/mc-loot-finder ${{ inputs.command }} \
            --seed ${{ inputs.seed }} \
            --structure ${{ inputs.structure }} \
            ${{ inputs.args }}
      - name: Run cross-platform smoke tests
        run: >-
          python3 ci/smoke.py
          --binary target/x86_64-unknown-linux-musl/release/mc-loot-finder
          --ancient-output ancient-city-chests.json
      - uses: actions/upload-artifact@v7
        with:
          name: ancient-city-chests
          path: ancient-city-chests.json
      - uses: actions/upload-artifact@v7
        with:
          name: mc-loot-finder-linux-x86_64
          path: target/x86_64-unknown-linux-musl/release/mc-loot-finder

  windows-x86_64:
    runs-on: windows-latest
    env:
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build release binary
        run: cargo build --release --locked
      - name: Run cross-platform smoke tests
        shell: pwsh
        run: >-
          python ci/smoke.py
          --binary target\release\mc-loot-finder.exe
      - name: Prepare Windows binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target\release\mc-loot-finder.exe dist\mc-loot-finder-windows-x86_64.exe
      - uses: actions/upload-artifact@v7
        with:
          name: mc-loot-finder-windows-x86_64
          path: dist/mc-loot-finder-windows-x86_64.exe
