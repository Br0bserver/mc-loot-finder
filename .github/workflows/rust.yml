name: Rust CI

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

on:
  workflow_dispatch:
  push:
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - .github/workflows/rust.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - .github/workflows/rust.yml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Check formatting
        run: cargo fmt --check
      - name: Check Rust CLI
        run: cargo check --locked
      - name: Test Rust CLI
        run: cargo test --release --locked
      - name: Build release binary
        run: cargo build --release --locked
      - name: Run ancient city smoke test
        run: |
          target/release/mc-loot-finder chests \
            --seed 114514 \
            --structure ancient_city \
            --radius 5000 \
            --limit 1000 \
            --json | tee ancient-city-chests.json
      - uses: actions/upload-artifact@v4
        with:
          name: ancient-city-chests
          path: ancient-city-chests.json
      - uses: actions/upload-artifact@v4
        with:
          name: mc-loot-finder-linux-x86_64
          path: target/release/mc-loot-finder
