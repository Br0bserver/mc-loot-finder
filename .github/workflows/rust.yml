name: Rust CI

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

on:
  workflow_dispatch:
    inputs:
      command:
        description: "CLI command to run (chests/find/candidates)"
        required: false
        default: "chests"
      structure:
        description: "Structure name"
        required: false
        default: "ancient_city"
      seed:
        description: "World seed"
        required: false
        default: "114514"
      args:
        description: "Extra CLI arguments (e.g. --radius 5000 --json)"
        required: false
        default: "--radius 5000 --json"
  push:
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/**
      - src/**
      - ci/**
      - .github/workflows/rust.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/**
      - src/**
      - ci/**
      - .github/workflows/rust.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint with clippy
        run: >-
          cargo clippy --locked --all-targets --
          -D warnings
          -D clippy::dbg_macro
          -D clippy::todo
          -D clippy::unimplemented
      - name: Check Rust CLI
        run: cargo check --locked
      - name: Test Rust CLI
        run: cargo test --release --locked
      - name: Install static Linux linker
        run: sudo apt-get update && sudo apt-get install --yes musl-tools zstd
      - name: Build static release binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Run requested CLI command (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          CLI_COMMAND: ${{ inputs.command }}
          CLI_STRUCTURE: ${{ inputs.structure }}
          CLI_SEED: ${{ inputs.seed }}
          CLI_ARGS: ${{ inputs.args }}
        run: |
          set -euo pipefail
          case "$CLI_COMMAND" in
            candidates|chests|find) ;;
            *) echo "unsupported CLI command: $CLI_COMMAND" >&2; exit 2 ;;
          esac
          read -r -a extra_args <<< "$CLI_ARGS"
          target/x86_64-unknown-linux-musl/release/mc-loot-finder \
            "$CLI_COMMAND" \
            --seed "$CLI_SEED" \
            --structure "$CLI_STRUCTURE" \
            "${extra_args[@]}"
      - name: Run Linux behavior smoke tests
        run: >-
          python3 ci/smoke.py
          --binary target/x86_64-unknown-linux-musl/release/mc-loot-finder
          --ancient-output ancient-city-chests.json
      - name: Download pinned SteelMC parity binary
        env:
          STEELMC_RELEASE_URL: https://github.com/Steel-Foundation/SteelMC/releases/download/v0.9.0%2Bmc26.1/steel-linux
          STEELMC_SHA256: cb902a0d10d8a9ac4c472416c9996c0581509ac12128fc7588132d4572a09f9e
        run: |
          curl --fail --location --retry 5 --retry-all-errors \
            --output steel-linux "$STEELMC_RELEASE_URL"
          printf '%s  %s\n' "$STEELMC_SHA256" steel-linux | sha256sum --check --strict
          chmod 755 steel-linux
      - name: Run independent SteelMC parity probe
        run: >-
          python3 ci/steelmc_probe.py
          --steel ./steel-linux
          --loot-finder target/x86_64-unknown-linux-musl/release/mc-loot-finder
          --seed 215
      - uses: actions/upload-artifact@v7
        with:
          name: ancient-city-chests
          path: ancient-city-chests.json
      - uses: actions/upload-artifact@v7
        with:
          name: mc-loot-finder-linux-x86_64
          path: target/x86_64-unknown-linux-musl/release/mc-loot-finder

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint with clippy
        run: >-
          cargo clippy --locked --all-targets --
          -D warnings
          -D clippy::dbg_macro
          -D clippy::todo
          -D clippy::unimplemented
      - name: Check Rust CLI
        run: cargo check --locked
      - name: Test Rust CLI
        run: cargo test --release --locked
      - name: Build Windows release binary
        run: cargo build --release --locked
      - name: Run Windows behavior smoke tests
        run: python ci/smoke.py --binary target/release/mc-loot-finder.exe
