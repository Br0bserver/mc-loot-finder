name: Pumpkin Jigsaw Probe

on:
  workflow_dispatch:
  push:
    branches:
      - agent/pumpkin-jigsaw-probe
    paths:
      - .github/workflows/pumpkin-jigsaw-probe.yml
      - tools/pumpkin-jigsaw-probe/**

jobs:
  vanilla-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "25"
          cache: gradle
      - name: Print Minecraft 26.1.2 layout summary
        run: ./gradlew test --tests dev.br0b.mclootfinder.vanilla.AncientCityLayoutProbeTest --info

  pumpkin-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Pumpkin-MC/Pumpkin
          ref: 98d4451fc9e925712a238e6ac44fef8ee2a0cfd4
          path: vendor/pumpkin
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/pumpkin-jigsaw-probe -> target
          cache-on-failure: true
      - name: Apply vanilla start-anchor shuffle
        run: git -C vendor/pumpkin apply ../../tools/pumpkin-jigsaw-probe/start-anchor-shuffle.patch
      - name: Apply vanilla target selection priority
        run: patch -d vendor/pumpkin -p1 < tools/pumpkin-jigsaw-probe/target-selection-priority.patch
      - name: Preserve missing-template RNG consumption
        run: git -C vendor/pumpkin apply ../../tools/pumpkin-jigsaw-probe/missing-template-rng.patch
      - name: Print Pumpkin layout summary
        run: cargo run --release --manifest-path tools/pumpkin-jigsaw-probe/Cargo.toml
