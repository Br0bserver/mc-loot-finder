name: Vanilla Subset CI

on:
  workflow_dispatch:
  push:
    branches:
      - experimental/vanilla-subset
  pull_request:
    branches:
      - experimental/vanilla-subset

permissions:
  contents: read

jobs:
  oracle-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Test oracle and provider boundary
        run: ./gradlew test installDist --no-daemon
      - name: Build self-contained app image
        run: >-
          python3 .github/scripts/build_app_image.py
          build/install/mc-loot-finder
          build/app-image/mc-loot-finder
      - name: Verify official runtime source bootstrap
        run: >-
          python3 .github/scripts/verify_runtime_bootstrap.py
          build/app-image/mc-loot-finder/bin/mc-loot-finder
          ${{ runner.temp }}/mc-loot-finder-runtime
      - name: Verify exact parity for all structures
        env:
          MC_LOOT_FINDER_CACHE: ${{ runner.temp }}/mc-loot-finder-runtime
        run: >-
          python3 .github/scripts/verify_engine_parity.py
          build/install/mc-loot-finder/bin/mc-loot-finder
          build/app-image/mc-loot-finder/bin/mc-loot-finder
      - name: Verify self-contained CLI
        env:
          JAVA_HOME: ""
          MC_LOOT_FINDER_CACHE: ${{ runner.temp }}/mc-loot-finder-runtime
        run: >-
          python3 .github/scripts/verify_distribution.py
          build/app-image/mc-loot-finder/bin/mc-loot-finder

  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build installed CLI
        run: .\gradlew.bat installDist --no-daemon
      - name: Build self-contained app image
        run: >-
          py -3 .github/scripts/build_app_image.py
          build/install/mc-loot-finder
          build/app-image/mc-loot-finder
      - name: Verify official runtime source bootstrap
        run: >-
          py -3 .github/scripts/verify_runtime_bootstrap.py
          build/app-image/mc-loot-finder/mc-loot-finder.exe
          ${{ runner.temp }}/mc-loot-finder-runtime
      - name: Verify exact parity for all structures
        env:
          MC_LOOT_FINDER_CACHE: ${{ runner.temp }}/mc-loot-finder-runtime
        run: >-
          py -3 .github/scripts/verify_engine_parity.py
          build/install/mc-loot-finder/bin/mc-loot-finder.bat
          build/app-image/mc-loot-finder/mc-loot-finder.exe
      - name: Verify self-contained CLI
        env:
          JAVA_HOME: ""
          MC_LOOT_FINDER_CACHE: ${{ runner.temp }}/mc-loot-finder-runtime
        run: >-
          py -3 .github/scripts/verify_distribution.py
          build/app-image/mc-loot-finder/mc-loot-finder.exe
